<!DOCTYPE html>
<html lang="es">
<head>

<title>Entretejiendo Lazos – Gestión y trazabilidad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#F1F9F8;--pn:#fff;--ink:#1B4A8A;--mu:#5B6E86;--ln:#D3E5E4;--ac:#0A8F89;--ac2:#E0242F;--sd:#fff;--sdt:#1B4A8A;--t1:#FF8916;--t2:#4E92B8;--t3:#8E6BC0;--t4:#0A9993;--t5:#F04561;--t6:#1F5FAE;--t7:#E0242F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A22;--pn:#18242E;--ink:#DCE8F7;--mu:#8FA3B8;--ln:#294050;--ac:#3CC3BB;--ac2:#FF6B76;--sd:#14202A;--sdt:#DCE8F7}}
:root[data-theme="dark"]{--bg:#101A22;--pn:#18242E;--ink:#DCE8F7;--mu:#8FA3B8;--ln:#294050;--ac:#3CC3BB;--ac2:#FF6B76;--sd:#14202A;--sdt:#DCE8F7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Poppins',system-ui,sans-serif}
h1,h2,h3{font-family:'Poppins',system-ui,sans-serif;margin:0;line-height:1.15}h2{font-family:'Dancing Script','Poppins',cursive;font-weight:700;color:var(--ac)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{border-right:1px solid var(--ln);background:var(--sd);color:var(--sdt);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:18px;padding:0 8px 2px}aside small{display:block;padding:0 8px 14px;opacity:.7;font-size:12px}
aside b{display:block;font-size:12px;opacity:.6;margin:14px 8px 4px;font-weight:500}
.nv{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:inherit;text-align:left;padding:7px 8px;border-radius:6px;font:inherit;cursor:pointer}
.nv:hover{background:var(--bg)}.nv.on{background:var(--ac);color:#fff}.lg{display:block;width:100%;max-width:190px;margin:0 auto 6px;border-radius:12px}.nv i{font-style:normal;opacity:.7;font-size:12px}
main{padding:24px clamp(14px,3vw,36px);min-width:0}
main h2{font-size:36px;margin-bottom:4px}.mu{color:var(--mu)}
.bar{display:flex;gap:8px;margin:14px 0 8px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;width:100%}
.bar input{flex:1;min-width:180px;width:auto}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:7px 12px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.dng{color:var(--ac2);border-color:var(--ac2)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
.wrap{overflow-x:auto;background:var(--pn);border:1px solid var(--ln);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
th{background:var(--bg);font-weight:600;position:sticky;top:0}tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
.empty{border:1px dashed var(--ln);border-radius:8px;padding:28px;text-align:center;color:var(--mu)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.st{flex:1 1 130px;background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--c,var(--ac));border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.st span{display:block;font-size:12px;color:var(--mu)}.st strong{font:700 26px 'Poppins',sans-serif;color:var(--c,var(--ink))}.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.hero svg{flex:1 1 200px;max-width:340px;height:auto}.tag{color:var(--t6);font-weight:600;margin:2px 0 6px}[data-theme=dark] .tag{color:var(--ink)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bx{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px}.bx h3{font-size:16px;margin-bottom:8px}
.bx p{margin:4px 0}.al{color:var(--ac2);font-weight:600}.ok{color:var(--ac);font-weight:600}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--pn);color:var(--ink);width:min(640px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:#0008}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.fg label{font-size:12px;color:var(--mu);display:block}.fg .w{grid-column:1/-1}
.ft{display:flex;gap:8px;justify-content:flex-end}.ft .dng{margin-right:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;display:none;z-index:9}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;max-height:42vh}.fg{grid-template-columns:1fr}}
</style>
</head>

const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,view='inicio',q='',ed=null;
const idc=k=>T.find(t=>t.k===k).f[0][0];
const REF=(k,l)=>()=>D[k].filter(r=>r[idc(k)]!=='').map(r=>[r[idc(k)],r[idc(k)]+(r[l]?' — '+r[l]:'')]);

const T=[
{k:'01_TEJEDORES',n:'Tejedores',p:'',f:[['ID_TEJEDOR'],['NOMBRE_COMPLETO'],['TIPO_PARTICIPACION','s',['Tejedor(a) voluntario(a)','Donante','Organizador(a)','Otro']],['FECHA_VINCULACION','d'],['CONTACTO'],['ESTADO','s',['Activo','Inactivo']],['OBSERVACIONES','a']]},
{k:'02_DONANTES',n:'Donantes',p:'DNT',f:[['ID_DONANTE'],['NOMBRE_DONANTE'],['TIPO_DONANTE','s',['Persona natural','Colaborador','Empresa/organización','Otro']],['CONTACTO'],['CORREO'],['OBSERVACIONES','a']]},
{k:'03_DONACIONES',n:'Donaciones',p:'DON',f:[['ID_DONACION'],['FECHA_RECEPCION','d'],['ID_DONANTE','s',REF('02_DONANTES','NOMBRE_DONANTE')],['TIPO_DONACION','s',['Material','Dinero','Producto terminado','Otro']],['MATERIAL','s',NM('CAT_MATERIALES','MATERIAL')],['UNIDADES','n'],['COLOR_CARACTERISTICA'],['ESTADO_RECEPCION','s',['Recibido','En verificación','Aceptado','Rechazado']],['DESTINO','s',['Entretejiendo Lazos','UCI Neonatal','Otro']],['RESPONSABLE_RECEPCION'],['OBSERVACIONES','a']]},
{k:'04_MATERIALES',n:'Materiales',p:'STK',f:[['ID_MATERIAL'],['MATERIAL','s',NM('CAT_MATERIALES','MATERIAL')],['CATEGORIA'],['CANTIDAD','n'],['ESTADO','s',['Disponible','Agotado','No conforme','Inactivo']],['OBSERVACIONES','a']]},
{k:'05_MOVIMIENTOS_INVENTARIO',n:'Movimientos de inventario',p:'MOV',f:[['ID_MOVIMIENTO'],['FECHA','d'],['TIPO_MOVIMIENTO','s',['Entrada','Salida','Ajuste positivo','Ajuste negativo','Traslado']],['ID_MATERIAL','s',REF('CAT_MATERIALES','MATERIAL')],['CANTIDAD','n'],['ORIGEN_DESTINO'],['ID_DONACION','s',REF('03_DONACIONES','MATERIAL')],['ID_TEJEDOR','s',REF('01_TEJEDORES','NOMBRE_COMPLETO')],['ID_PRODUCCION','s',REF('07_PRODUCCION','ID_PRODUCTO')],['RESPONSABLE'],['OBSERVACIONES','a']]},

function inicio(){const st=[['Donación','03_DONACIONES','--t1'],['Inventario','05_MOVIMIENTOS_INVENTARIO','--t2'],['Producción','07_PRODUCCION','--t3'],['Control de calidad','08_CONTROL_CALIDAD','--t4'],['Producto terminado','06_PRODUCTOS','--t5'],['Entrega al servicio','09_ENTREGAS_SERVICIO','--t6'],['Evidencia','10_EVIDENCIAS','--t7']];
const al=stock().filter(s=>s.ALERTA==='REVISAR');
return `<div class="hero"><div><h2>Entretejiendo lazos</h2><p class="tag">San Rafa le pone el corazón</p><p class="mu">Centraliza donaciones, materiales, producción, control de calidad y entregas de la estrategia, en el Hospital Universitario San Rafael de Tunja.</p></div><svg viewBox="0 0 340 70" aria-hidden="true"><path d="M2 58C60 62 110 56 150 40S215 14 205 30 160 48 190 54 260 40 338 22" fill="none" stroke="#E0242F" stroke-width="3" stroke-linecap="round"/></svg></div>
<div class="flow">${st.map(s=>`<button class="st" style="--c:var(${s[2]})" data-v="${s[1]}"><span>${s[0]}</span><strong>${D[s[1]].length}</strong></button>`).join('')}</div>
<div class="g2"><div class="bx"><h3>Inventario</h3>${al.length?al.map(s=>`<p><span class="al">REVISAR</span> ${E(s.MATERIAL)}: saldo ${s.SALDO}</p>`).join(''):'<p class="ok">Sin alertas</p>'}</div>
<div class="bx"><h3>Control de calidad</h3><p>Aprobados: ${cnt('08_CONTROL_CALIDAD','RESULTADO_FINAL','Aprobado')}</p><p>Rechazados: ${cnt('08_CONTROL_CALIDAD','RESULTADO_FINAL','Rechazado')}</p><p>Pendientes: ${cnt('08_CONTROL_CALIDAD','RESULTADO_FINAL','Pendiente')}</p></div>
<div class="bx"><h3>Producción</h3><p>En elaboración: ${cnt('07_PRODUCCION','ESTADO_PRODUCCION','En elaboración')}</p><p>En revisión: ${cnt('07_PRODUCCION','ESTADO_PRODUCCION','En revisión')}</p><p>Aprobadas: ${cnt('07_PRODUCCION','ESTADO_PRODUCCION','Aprobada')}</p></div></div>`}
function table(h,rows,attr){return `<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function list(t){const rows=D[t.k].map((r,i)=>[r,i]).filter(([r])=>!q||Object.values(r).join(' ').toLowerCase().includes(q.toLowerCase()));
return `<h2>${t.n}</h2><div class="bar"><input id="q" type="search" placeholder="Buscar en ${t.n.toLowerCase()}" value="${E(q)}"><button class="pri" data-a="new">Nuevo registro</button></div><p class="mu">${rows.length} de ${D[t.k].length} registros</p>${rows.length?table(t.f.map(f=>f[0]),rows.map(([r,i])=>`<tr data-a="edit" data-i="${i}">${t.f.map(f=>`<td>${E(r[f[0]])}</td>`).join('')}</tr>`)):`<div class="empty">${D[t.k].length?'Ningún registro coincide con la búsqueda.':'Aún no hay registros. Usa “Nuevo registro” para crear el primero.'}</div>`}`}
function resumen(){const s=stock();return `<h2>Resumen de inventario</h2><p class="mu">Se calcula con los movimientos de inventario y el stock mínimo de cada material (editable en el catálogo).</p>${s.length?table(['ID_MATERIAL','MATERIAL','UNIDAD','ENTRADAS','SALIDAS','SALDO','MÍNIMO','ALERTA'],s.map(r=>`<tr><td>${E(r.ID_MATERIAL)}</td><td>${E(r.MATERIAL)}</td><td>${E(r.UNIDAD)}</td><td>${r.ENTRADAS}</td><td>${r.SALIDAS}</td><td><b>${r.SALDO}</b></td><td>${r.MINIMO}</td><td class="${r.ALERTA==='OK'?'ok':'al'}">${r.ALERTA}</td></tr>`)):'<div class="empty">Agrega materiales al catálogo para ver su saldo.</div>'}`}
function render(){nav();const t=T.find(x=>x.k===view);$('#main').innerHTML=view==='inicio'?inicio():view==='resumen'?resumen():view==='notas'?`<h2>Notas</h2><div class="bx">${NOTAS.map((n,i)=>`<p>${i+1}. ${E(n)}</p>`).join('')}</div>`:list(t)}
function form(i){const t=T.find(x=>x.k===view);ed=i;const r=i==null?{}:D[t.k][i];
$('#dlg').innerHTML=`<h3>${i==null?'Nuevo registro':'Editar registro'} · ${t.n}</h3><div class="fg">${t.f.map((f,j)=>{const v=r[f[0]]??(j===0&&i==null&&t.p?nextId(t):''),ty=f[1],ro=j===0&&i!=null?'readonly':'';let c;
if(ty==='s')c=`<select name="${E(f[0])}"><option value="">—</option>${opts(f,v).map(o=>`<option value="${E(o[0])}" ${o[0]==v?'selected':''}>${E(o[1])}</option>`).join('')}</select>`;
else if(ty==='a')c=`<textarea name="${E(f[0])}" rows="2">${E(v)}</textarea>`;
else c=`<input name="${E(f[0])}" type="${ty==='d'?'date':ty==='n'?'number':'text'}" value="${E(v)}" ${ro}>`;
return `<div class="${ty==='a'?'w':''}"><label>${E(f[0])}</label>${c}</div>`}).join('')}</div>
<div class="ft">${i!=null?'<button class="dng" data-a="del">Eliminar</button>':''}<button data-a="cancel">Cancelar</button><button class="pri" data-a="save">Guardar</button></div>`;$('#dlg').showModal()}
function nextId(t){const n=D[t.k].map(r=>parseInt(String(r[t.f[0][0]]).split('-').pop())||0);return t.p+'-'+String(Math.max(0,...n)+1).padStart(3,'0')}
function commit(){const t=T.find(x=>x.k===view),r={};
t.f.forEach(f=>{const el=$('#dlg [name="'+f[0]+'"]');let v=el.value.trim();r[f[0]]=f[1]==='n'&&v!==''?+v:v});
const id=r[t.f[0][0]];if(!id){toast('Falta el '+t.f[0][0]);return}
if(D[t.k].some((x,i)=>i!==ed&&String(x[t.f[0][0]])===String(id))){toast('Ese '+t.f[0][0]+' ya existe');return}
ed==null?D[t.k].push(r):D[t.k][ed]=r;save();$('#dlg').close();render();toast('Guardado')}
async function exportar(){const wb=XLSX.utils.book_new();
T.forEach(t=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D[t.k],{header:t.f.map(f=>f[0])}),t.k));
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(stock()),'11_RESUMEN_INVENTARIO');
const data=XLSX.write(wb,{type:'array',bookType:'xlsx'});
try{const d=await claude.use('downloads');if(!d){toast('La descarga no está disponible en esta vista');return}await d.save({filename:'Entretejiendo_Lazos.xlsx',data});}catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo')}}
$('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer());let n=0;const nd={};
T.forEach(t=>{const ws=wb.Sheets[t.k];nd[t.k]=[];if(!ws)return;n++;XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(r=>{const o={};t.f.forEach(x=>o[x[0]]=r[x[0]]==null?'':(x[1]==='n'?(r[x[0]]===''?'':+r[x[0]]):String(r[x[0]]).trim()));if(o[t.f[0][0]]!=='')nd[t.k].push(o)})});
if(!n){toast('El archivo no tiene las hojas del sistema');return}
if(!confirm('Esto reemplaza los datos actuales por los del archivo. ¿Continuar?'))return;D=nd;save();render();toast('Datos importados')}catch(x){toast('No se pudo leer el archivo')}e.target.value=''};
document.addEventListener('click',e=>{const b=e.target.closest('[data-v],[data-a]');if(!b)return;
if(b.dataset.v){const v=b.dataset.v;if(v==='_exp')return exportar();if(v==='_imp')return $('#imp').click();if(v==='_rst'){if(confirm('Se borrarán los datos y volverán los valores iniciales del Excel. ¿Continuar?')){seed();save();render()}return}view=v;q='';render();scrollTo(0,0);return}
const a=b.dataset.a;if(a==='new')form(null);else if(a==='edit')form(+b.dataset.i);else if(a==='cancel')$('#dlg').close();else if(a==='save')commit();
else if(a==='del'&&confirm('¿Eliminar este registro?')){D[view].splice(ed,1);save();$('#dlg').close();render()}});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)});
load();render();
</script>
</body>
</html>
